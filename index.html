    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010208; /* Lebih pekat biar bintangnya terang */
            --accent: #00d2ff;
            --secondary: #7000ff;
            --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.02);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--accent), var(--secondary)); border-radius: 10px; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* ----- FUNGSI BINTANG & BINTANG JATUH (COSMIC BACKGROUND) ----- */
        .cosmic-container {
            position: fixed; inset: 0; z-index: -1; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #0a1128 0%, #010208 100%);
            overflow: hidden;
        }

        /* Ribuan Bintang Kecil Berkedip */
        .star {
            position: absolute; border-radius: 50%; background: white;
            animation: twinkle 5s infinite ease-in-out;
        }
        @keyframes twinkle { 
            0%, 100% { opacity: 0.3; transform: scale(0.8); } 
            50% { opacity: 1; transform: scale(1.1); } 
        }

        /* BINTANG JATUH (SHOOTING STAR) */
        .shooting-star {
            position: absolute; height: 1.5px;
            background: linear-gradient(-45deg, rgba(95, 145, 255, 1), rgba(0, 0, 255, 0));
            border-radius: 999px;
            filter: drop-shadow(0 0 10px rgba(105, 155, 255, 1));
            animation: shooting 3s linear infinite;
            opacity: 0;
        }
        .shooting-star::before {
            content: ''; position: absolute; top: calc(50% - 1px); right: 0; height: 1.5px;
            background: linear-gradient(-45deg, rgba(0, 0, 255, 0), rgba(95, 145, 255, 1), rgba(0, 0, 255, 0));
            border-radius: 100%; transform: translateX(50%) rotateZ(45deg);
        }

        @keyframes shooting {
            0% { transform: rotate(-45deg) translateX(-200px); opacity: 0; width: 0; }
            5% { width: 50px; opacity: 1; }
            10% { width: 150px; }
            15% { transform: rotate(-45deg) translateX(400px); opacity: 0; width: 0; }
            100% { opacity: 0; width: 0; }
        }

        /* ----- UI DESIGN (TETAP SAMA TAPI DIPOLEH) ----- */
        #pintu-masuk {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            transition: 1.5s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .intro-ui { text-align: center; }
        .intro-ui h1 { 
            font-family: 'Space Grotesk', sans-serif; font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 700; letter-spacing: 20px; margin-bottom: 40px;
            background: linear-gradient(to bottom, #fff, #444); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255,255,255,0.15);
        }
        .btn-enter {
            background: none; border: 1px solid rgba(255,255,255,0.1); color: #fff;
            padding: 18px 60px; border-radius: 100px; cursor: pointer;
            letter-spacing: 6px; font-size: 0.75rem; transition: 0.5s; text-transform: uppercase;
        }
        .btn-enter:hover { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 40px rgba(255,255,255,0.3); }

        header { padding: 90px 20px 40px; text-align: center; }
        .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 0.75rem; letter-spacing: 12px; color: var(--accent); margin-bottom: 12px; font-weight: 500;}
        h2.main-title { font-size: 3.8rem; font-weight: 600; letter-spacing: -2px; }

        .music-box {
            max-width: 320px; margin: 40px auto; background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.06); padding: 18px; border-radius: 30px;
            backdrop-filter: blur(25px); text-align: center;
        }
        .music-box span { font-size: 9px; letter-spacing: 2.5px; opacity: 0.5; display: block; margin-bottom: 15px; text-transform: uppercase;}
        audio { width: 100%; height: 32px; filter: invert(1) hue-rotate(180deg); }

        nav { display: flex; justify-content: center; gap: 12px; margin-bottom: 60px; padding: 0 20px;}
        .nav-link {
            background: rgba(10, 10, 10, 0.6); border: 1px solid rgba(255,255,255,0.08);
            color: #777; padding: 14px 35px; border-radius: 100px; cursor: pointer;
            font-weight: 600; font-size: 0.85rem; transition: 0.4s; backdrop-filter: blur(10px);
        }
        .nav-link.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 20px rgba(0,210,255,0.15); }

        .section { max-width: 1450px; margin: 0 auto; padding: 0 25px 120px; display: none; animation: slideUp 1.2s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .card { 
            background: var(--card-bg); border-radius: 20px; overflow: hidden; 
            aspect-ratio: 1/1; border: 1px solid rgba(255,255,255,0.04);
            transition: 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .card:hover { transform: scale(1.04) translateY(-8px); border-color: var(--accent); box-shadow: 0 30px 60px rgba(0,0,0,0.7); }
        img, video { width: 100%; height: 100%; object-fit: cover; }

        footer { text-align: center; padding: 70px 20px; border-top: 1px solid rgba(255,255,255,0.05); opacity: 0.2; font-size: 0.75rem; letter-spacing: 4px; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            h2.main-title { font-size: 2.8rem; }
            .intro-ui h1 { letter-spacing: 12px; }
            .nav-link { padding: 12px 25px; font-size: 0.8rem; }
        }
    </style>

    <script>
        // SCRIPT BUAT BINTANG KECIL (STARS)
        function generateStars() {
            const cosmic = document.getElementById('cosmic');
            for (let i = 0; i < 300; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.animationDelay = Math.random() * 5 + 's';
                cosmic.appendChild(star);
            }
        }
        generateStars(); // Jalankan fungsi bintang saat web dibuka

        // FUNGSI UTAMA (REVEAL & TAB)
        function reveal() {
            const ent = document.getElementById('pintu-masuk');
            ent.style.transform = 'translateY(-100%)';
            document.getElementById('bg-music').play();
            setTimeout(() => { show('foto'); }, 500);
        }

        function show(tab) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            
            document.getElementById(tab).style.display = 'block';
            document.getElementById('btn-' + tab.charAt(0)).classList.add('active');
        }
    </script>
