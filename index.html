    <style>
        :root { --bg: #050810; --accent: #00d2ff; --card: #111827; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* Overlay Awal */
        #pintu-masuk { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; justify-content: center; align-items: center; text-align: center; }
        .btn-masuk { padding: 15px 40px; background: var(--accent); border: none; border-radius: 50px; cursor: pointer; font-weight: bold; color: #000; font-size: 1.1rem; }

        .hero { padding: 40px 20px; text-align: center; }
        .hero h1 { font-size: 2.5rem; letter-spacing: 3px; }

        /* Audio Player Manual */
        .audio-box { max-width: 400px; margin: 0 auto 30px; background: #1a2235; padding: 15px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; }
        .audio-box p { font-size: 0.8rem; margin-bottom: 10px; color: var(--accent); font-weight: bold; }
        audio { width: 100%; height: 35px; }

        /* Menu */
        .menu-container { display: flex; justify-content: center; gap: 10px; margin: 20px auto; max-width: 500px; padding: 0 20px; }
        .btn-menu { flex: 1; padding: 12px; background: #0f172a; border: 1px solid var(--accent); color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-menu:active { background: var(--accent); color: black; }

        /* Galeri */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .card { background: #111827; border-radius: 8px; overflow: hidden; aspect-ratio: 1/1; border: 1px solid rgba(255,255,255,0.05); }
        img, video { width: 100%; height: 100%; object-fit: cover; }
        
        h2 { margin-bottom: 20px; color: var(--accent); text-align: center; font-size: 1.2rem; }
        footer { text-align: center; padding: 40px; opacity: 0.3; font-size: 0.7rem; }
    </style>
</head>
