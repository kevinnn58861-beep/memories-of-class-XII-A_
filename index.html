    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010208;
            --accent: #00d2ff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Background Galaksi */
        #star-canvas { position: fixed; inset: 0; z-index: -1; }

        /* Layar Pembuka */
        #pintu {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 1.5s cubic-bezier(0.8, 0, 0.2, 1);
        }
        #pintu h1 { font-family: 'Space Grotesk'; font-size: 5rem; letter-spacing: 15px; margin-bottom: 30px; opacity: 0.8; }
        .btn-unlock {
            padding: 20px 60px; background: none; border: 1px solid var(--border);
            color: #fff; border-radius: 100px; cursor: pointer; letter-spacing: 5px;
            transition: 0.5s; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn-unlock:hover { border-color: var(--accent); box-shadow: 0 0 30px var(--accent); background: #fff; color: #000; }

        /* Header & Music */
        header { padding: 100px 20px 40px; text-align: center; }
        .tagline { color: var(--accent); letter-spacing: 10px; font-size: 0.7rem; margin-bottom: 10px; text-transform: uppercase; }
        header h2 { font-family: 'Space Grotesk'; font-size: 3.5rem; }
        
        .player-box {
            max-width: 320px; margin: 30px auto; background: var(--glass);
            border: 1px solid var(--border); padding: 20px; border-radius: 25px;
            backdrop-filter: blur(20px);
        }
        audio { width: 100%; height: 30px; filter: invert(1); opacity: 0.6; }

        /* Navigasi Sticky */
        nav { 
            display: flex; justify-content: center; gap: 15px; 
            padding: 20px; position: sticky; top: 0; z-index: 999;
        }
        .tab-btn {
            background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            color: #aaa; padding: 12px 35px; border-radius: 100px; 
            cursor: pointer; transition: 0.4s; backdrop-filter: blur(10px);
        }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 20px rgba(0,210,255,0.2); }

        /* Grid System */
        .main-container { max-width: 1400px; margin: 0 auto; padding: 0 20px 100px; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .item { 
            background: var(--glass); aspect-ratio: 1/1; border-radius: 15px; 
            overflow: hidden; border: 1px solid var(--border); transition: 0.6s;
        }
        .item:hover { transform: scale(1.05) translateY(-10px); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        img, video { width: 100%; height: 100%; object-fit: cover; }

        footer { text-align: center; padding: 80px; opacity: 0.3; font-size: 0.7rem; letter-spacing: 5px; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
            #pintu h1 { font-size: 2.5rem; letter-spacing: 8px; }
            header h2 { font-size: 2.2rem; }
        }
    </style>
</head>

    <script>
        // Animasi Bintang (Canvas)
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<400; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: Math.random() * 0.05
                });
            }
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                ctx.globalAlpha = s.opacity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
                s.y += s.speed;
                if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(animate);
        }
        initStars();
        animate();
        window.onresize = initStars;

        // Kontrol Web
        function start() {
            document.getElementById('pintu').style.transform = 'translateY(-100%)';
            document.getElementById('audio-player').play();
            setTimeout(() => openTab('foto'), 800);
        }

        function openTab(name) {
            document.querySelectorAll('.main-container').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).style.display = 'block';
            document.getElementById('btn-' + name.charAt(0)).classList.add('active');
        }
    </script>
